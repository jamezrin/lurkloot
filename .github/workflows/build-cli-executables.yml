name: Build CLI executables

# The standalone `lurkloot` executables (#1022): Node's single-executable application, one per
# target, each built and smoke-tested on a runner of its own OS and architecture. The candidate
# build calls this to publish the archives; pull requests that touch the build inputs run it so every
# target still builds and starts.

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      version:
        description: Optional release version to overlay before building
        type: string
        default: ""
      artifact_prefix:
        type: string
        default: cli-executable
    outputs:
      has_archives:
        description: Whether the checkout supports standalone CLI builds and produced archives
        value: ${{ jobs.build.outputs.has_archive }}
  pull_request:
    paths:
      - packages/app-ui/**
      - packages/cli/**
      - packages/core/**
      - packages/locales/**
      - packages/popup-ui/**
      - packages/shared/**
      - pnpm-lock.yaml
      - scripts/release/pipeline.mjs
      - .github/workflows/build-cli-executables.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: macos-arm64
            runner: macos-latest
          - target: macos-x64
            runner: macos-15-intel
          - target: windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    outputs:
      # All matrix legs build from the same ref, so this boolean is identical across them.
      has_archive: ${{ steps.support.outputs.available }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Check for standalone CLI support
        id: support
        run: |
          if test -f packages/cli/scripts/buildExecutable.mjs; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "This checkout predates the standalone CLI build."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: steps.support.outputs.available == 'true'
        with:
          version: 12.21.0
      # The executable is a copy of this Node binary, so this is the Node version that ships.
      - uses: actions/setup-node@v7
        if: steps.support.outputs.available == 'true'
        with:
          node-version: 26
          cache: pnpm
      - name: Set the release version
        if: steps.support.outputs.available == 'true' && inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/release/cli.mjs prepare-workspace --version "$VERSION" --date "$(date -u +%F)"
      # Only the CLI's workspace subtree, as the Docker build installs it. app-ui is a dev
      # dependency of the CLI, so its build inputs come along.
      - run: pnpm install --frozen-lockfile --filter @lurkloot/cli...
        if: steps.support.outputs.available == 'true'
      - run: pnpm --filter @lurkloot/cli build:executable --archive "$GITHUB_WORKSPACE/cli-assets"
        if: steps.support.outputs.available == 'true'
      # Unpacks the archive into a fresh directory and runs it with no node on PATH: serve must
      # answer /v1/session and /, and a Kick request through the shipped cycletls is reported
      # (a warning when Kick's WAF challenges the runner).
      - name: Smoke-test the archive
        if: steps.support.outputs.available == 'true'
        run: |
          archive=$(find cli-assets -maxdepth 1 -name 'lurkloot-cli-*' -print -quit)
          test -n "$archive"
          node packages/cli/scripts/smokeExecutable.mjs "$archive"
      - uses: actions/upload-artifact@v7
        if: steps.support.outputs.available == 'true'
        with:
          name: ${{ inputs.artifact_prefix || 'cli-executable' }}-${{ matrix.target }}
          path: cli-assets/lurkloot-cli-*
          if-no-files-found: error
          retention-days: 7
