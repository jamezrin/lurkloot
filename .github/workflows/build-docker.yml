name: Build CLI Docker image

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      version:
        description: Optional release version to overlay before building
        type: string
        default: ""
      trusted_tools_ref:
        description: Immutable trusted release-tooling commit; required with version
        type: string
        default: ""
      artifact_prefix:
        type: string
        default: docker-digest
      push:
        type: boolean
        default: false
      pr_number: { type: string, default: "" }
      expected_head_sha: { type: string, default: "" }
      release_label: { type: string, default: "" }
    outputs:
      image_tag:
        value: ${{ jobs.publish.outputs.image_tag }}

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/lurkloot-cli

jobs:
  build:
    permissions:
      contents: read
      packages: none
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: inputs.version != ''
        with:
          node-version: 24
      - uses: actions/checkout@v7
        if: inputs.version != ''
        with:
          ref: ${{ inputs.trusted_tools_ref }}
          path: trusted-release-tools
          persist-credentials: false
      - name: Apply release version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
          TRUSTED_TOOLS_REF: ${{ inputs.trusted_tools_ref }}
        run: |
          [[ "$TRUSTED_TOOLS_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "trusted_tools_ref must be an immutable commit SHA" >&2; exit 1; }
          test "$(git -C trusted-release-tools rev-parse HEAD)" = "$TRUSTED_TOOLS_REF"
          node trusted-release-tools/scripts/release/cli.mjs prepare-workspace "$VERSION"
          rm -rf trusted-release-tools
      - uses: docker/setup-buildx-action@v4
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/cli/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }},ignore-error=true
          push: false
          # The publish job re-finds the loaded image by this exact tag, so version must be used
          # verbatim when set. Validation builds pass no version, so fall back to a valid literal
          # rather than emitting an invalid ":-arch" reference.
          tags: ${{ env.IMAGE_NAME }}:${{ inputs.version || 'validation' }}-${{ matrix.arch }}
          outputs: type=oci,dest=/tmp/image-${{ matrix.arch }}.tar
      - name: Checksum OCI artifact
        run: cd /tmp && sha256sum image-${{ matrix.arch }}.tar > image-${{ matrix.arch }}.tar.sha256
      - if: inputs.push
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-oci-${{ matrix.arch }}
          path: /tmp/image-${{ matrix.arch }}.tar*
          retention-days: 1
      - name: Summarize Docker build
        env:
          PLATFORM: ${{ matrix.platform }}
          PUSHED: ${{ inputs.push }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '## Docker build\n\n- Platform: `%s`\n- Publication requested: `%s`\n' "$PLATFORM" "$PUSHED" >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: inputs.push
    needs: build
    runs-on: ubuntu-latest
    environment: prereleases
    permissions:
      contents: read
      packages: write
      pull-requests: read
    outputs:
      image_tag: ${{ steps.publish.outputs.image_tag }}
    env:
      RELEASE_TOOLS: trusted-release-tools
    steps:
      # Revalidation runs the trusted tooling, never the candidate's own copy, so this job checks
      # out the pinned release tools rather than the candidate ref.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.trusted_tools_ref }}
          path: trusted-release-tools
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact_prefix }}-oci-*
          path: images
          merge-multiple: true
      - name: Verify OCI artifacts
        working-directory: images
        run: sha256sum -c image-amd64.tar.sha256 && sha256sum -c image-arm64.tar.sha256
      - name: Revalidate candidate immediately before amd64 registry mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          RELEASE_LABEL: ${{ inputs.release_label }}
        run: |
          node "$RELEASE_TOOLS/scripts/release/cli.mjs" prepare pr-assert --pr "$PR" --expected-sha "$EXPECTED_HEAD_SHA" --label "$RELEASE_LABEL"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Stage immutable OCI amd64
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PR: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          RELEASE_LABEL: ${{ inputs.release_label }}
        run: |
          node "$RELEASE_TOOLS/scripts/release/cli.mjs" prepare pr-assert --pr "$PR" --expected-sha "$EXPECTED_HEAD_SHA" --label "$RELEASE_LABEL"
          staging="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker load --input images/image-amd64.tar
          docker tag "$IMAGE_NAME:$VERSION-amd64" "$IMAGE_NAME:$staging-amd64"
          docker push "$IMAGE_NAME:$staging-amd64"
      - name: Revalidate candidate immediately before arm64 registry mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          RELEASE_LABEL: ${{ inputs.release_label }}
        run: |
          node "$RELEASE_TOOLS/scripts/release/cli.mjs" prepare pr-assert --pr "$PR" --expected-sha "$EXPECTED_HEAD_SHA" --label "$RELEASE_LABEL"
      - name: Stage immutable OCI arm64
        env:
          VERSION: ${{ inputs.version }}
        run: |
          staging="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker load --input images/image-arm64.tar
          docker tag "$IMAGE_NAME:$VERSION-arm64" "$IMAGE_NAME:$staging-arm64"
          docker push "$IMAGE_NAME:$staging-arm64"
      - name: Revalidate candidate immediately before immutable manifest mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          RELEASE_LABEL: ${{ inputs.release_label }}
        run: |
          node "$RELEASE_TOOLS/scripts/release/cli.mjs" prepare pr-assert --pr "$PR" --expected-sha "$EXPECTED_HEAD_SHA" --label "$RELEASE_LABEL"
      - id: publish
        name: Stage immutable OCI manifest
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir digests
          staging="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create --tag "$IMAGE_NAME:$staging" "$IMAGE_NAME:$staging-amd64" "$IMAGE_NAME:$staging-arm64"
          digest=$(docker buildx imagetools inspect "$IMAGE_NAME:$staging" --format '{{json .Manifest.Digest}}' | tr -d '"' | sed 's/^sha256://')
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || exit 1
          touch "digests/$digest"
          echo "image_tag=$IMAGE_NAME:$staging" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-digest-published
          path: digests/*
          retention-days: 1
