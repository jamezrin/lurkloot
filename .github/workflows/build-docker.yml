name: Build CLI Docker image

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      version:
        description: Optional release version to overlay before building
        type: string
        default: ""
      trusted_tools_ref:
        description: Immutable trusted release-tooling commit; required with version
        type: string
        default: ""
      artifact_prefix:
        type: string
        default: docker-digest
      push:
        type: boolean
        default: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/lurkloot-cli

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: inputs.version != ''
        with:
          node-version: 24
      - uses: actions/checkout@v7
        if: inputs.version != ''
        with:
          ref: ${{ inputs.trusted_tools_ref }}
          path: trusted-release-tools
          persist-credentials: false
      - name: Apply release version
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
          TRUSTED_TOOLS_REF: ${{ inputs.trusted_tools_ref }}
        run: |
          [[ "$TRUSTED_TOOLS_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "trusted_tools_ref must be an immutable commit SHA" >&2; exit 1; }
          test "$(git -C trusted-release-tools rev-parse HEAD)" = "$TRUSTED_TOOLS_REF"
          node trusted-release-tools/scripts/release/cli.mjs prepare-workspace "$VERSION"
          rm -rf trusted-release-tools
      - uses: docker/setup-buildx-action@v4
      - if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/cli/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          push: ${{ inputs.push }}
          outputs: ${{ inputs.push && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE_NAME) || 'type=cacheonly' }}
      - if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - if: inputs.push
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
      - name: Summarize Docker build
        env:
          PLATFORM: ${{ matrix.platform }}
          PUSHED: ${{ inputs.push }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '## Docker build\n\n- Platform: `%s`\n- Pushed: `%s`\n- Digest: `%s`\n' "$PLATFORM" "$PUSHED" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
