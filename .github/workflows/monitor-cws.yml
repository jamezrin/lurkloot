name: Refresh CWS status

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Optional candidate version; blank checks all active prereleases
        type: string
        default: ""
      recovery:
        description: Allow a matching PUBLISHED state during partial-promotion recovery
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cws-mutation
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REQUESTED_VERSION: ${{ inputs.version }}
      RECOVERY: ${{ inputs.recovery || false }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Copy the whole directory: a hand-maintained file list silently breaks at runtime the moment
      # the release tooling grows an import, and nothing in CI would catch it.
      - name: Preserve trusted release tooling
        run: |
          mkdir -p "$RUNNER_TEMP/release-tools"
          cp scripts/cws.mjs scripts/release.mjs "$RUNNER_TEMP/release-tools/"
          cp -R scripts/release "$RUNNER_TEMP/release-tools/release"
      - name: Validate optional version input
        run: |
          [[ -z "$REQUESTED_VERSION" || "$REQUESTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "version must be blank or stable SemVer X.Y.Z" >&2; exit 1; }
      - name: Refresh active candidates
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          TOOLS: ${{ runner.temp }}/release-tools
        run: |
          if [[ -n "$REQUESTED_VERSION" ]]; then
            versions="$REQUESTED_VERSION"
          else
            versions=$(gh release list --limit 100 --json tagName,isPrerelease,name --jq '.[] | select(.isPrerelease and ((.name // "") | endswith("cancelled") | not)) | .tagName | sub("^v";"")')
          fi
          while read -r version; do
            [[ -n "$version" ]] || continue
            rm -rf candidate report && mkdir candidate report
            gh release download "v$version" --pattern candidate.json --dir candidate
            GITHUB_OUTPUT=report/candidate node "$TOOLS/release/cli.mjs" candidate read --file candidate/candidate.json --version "$version"
            pr=$(sed -n 's/^pr=//p' report/candidate)
            [[ $(gh pr view "$pr" --json state --jq .state) == OPEN ]] || continue
            branch=$(gh pr view "$pr" --json headRefName --jq .headRefName)
            git fetch origin "$branch"
            git checkout -B "$branch" FETCH_HEAD
            head_sha=$(git rev-parse HEAD)
            CWS_VERSION="$version" GITHUB_OUTPUT=report/cws node "$TOOLS/cws.mjs" status
            gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" --paginate --jq '.[].body | @json' > report/comments
            GITHUB_OUTPUT=report/outputs node "$TOOLS/release/cli.mjs" cws-report \
              --candidate candidate/candidate.json --status report/cws --comments report/comments \
              --head-sha "$head_sha" --version "$version" --recovery "$RECOVERY" --report-dir report
            status=$(sed -n 's/^status=//p' report/outputs)
            conclusion=$(sed -n 's/^conclusion=//p' report/outputs)
            title=$(sed -n 's/^title=//p' report/outputs)
            summary=$(sed -n 's/^summary=//p' report/outputs)
            if [[ $(sed -n 's/^finalize=//p' report/outputs) == true ]]; then
              node "$TOOLS/release/cli.mjs" prepare-workspace "$version" --date "$(date -u +%F)"
              git add package.json packages/*/package.json packages/site/src/changelog.json
              git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "chore(release): finalize $version metadata"
              git push origin "$branch"
              head_sha=$(git rev-parse HEAD)
              gh workflow run pr-validation.yml --ref "$branch"
            fi
            args=(-f name=cws-release-ready -f head_sha="$head_sha" -f status="$status" -f output[title]="$title" -f output[summary]="$summary")
            [[ -z "$conclusion" ]] || args+=(-f conclusion="$conclusion")
            gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" "${args[@]}"
            gh release edit "v$version" --prerelease --latest=false --notes-file report/notes.md
            if [[ $(sed -n 's/^should_comment=//p' report/outputs) == true ]]; then
              gh pr comment "$pr" --body-file report/comment.md
            fi
          done <<< "$versions"
