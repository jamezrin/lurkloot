name: Refresh CWS status

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: Optional candidate version; blank checks all active prereleases
        type: string
        default: ""
      recovery:
        description: Allow a matching PUBLISHED state during partial-promotion recovery
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cws-mutation
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: write
      contents: write
      pull-requests: write
    steps:
      # Trusted tooling from main only. The candidate's own release metadata is fetched from the
      # API at its source commit, so no candidate code is checked out or executed here.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Refresh active candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RECOVERY: ${{ inputs.recovery || false }}
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: >-
          node scripts/release/cli.mjs monitor run
          --version "$REQUESTED_VERSION" --recovery "$RECOVERY" --report-dir "$RUNNER_TEMP/report"
