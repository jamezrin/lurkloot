name: Build extension artifacts

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""
      version:
        description: Optional release version to overlay before building
        type: string
        default: ""
      trusted_tools_ref:
        description: Immutable trusted release-tooling commit; required with version
        type: string
        default: ""
      artifact_name:
        type: string
        default: extension-release-assets
      sign_crx:
        type: boolean
        default: false
    secrets:
      CRX_PRIVATE_KEY:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/checkout@v7
        if: inputs.version != ''
        with:
          ref: ${{ inputs.trusted_tools_ref }}
          path: trusted-release-tools
          persist-credentials: false
      - name: Apply release version
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TRUSTED_TOOLS_REF: ${{ inputs.trusted_tools_ref }}
        run: |
          [[ "$TRUSTED_TOOLS_REF" =~ ^[0-9a-f]{40}$ ]] || { echo "trusted_tools_ref must be an immutable commit SHA" >&2; exit 1; }
          test "$(git -C trusted-release-tools rev-parse HEAD)" = "$TRUSTED_TOOLS_REF"
          node trusted-release-tools/scripts/release/cli.mjs prepare-workspace "$RELEASE_VERSION"
          rm -rf trusted-release-tools
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm zip && pnpm zip:firefox
      - name: Normalize reproducible ZIP artifacts
        shell: bash
        run: |
          version=$(node scripts/release/cli.mjs version)
          output=packages/extension/.output
          mkdir release-assets
          chrome_zip=$(find "$output" -maxdepth 1 -name "*-$version-chrome.zip" -print -quit)
          firefox_zip=$(find "$output" -maxdepth 1 -name "*-$version-firefox.zip" -print -quit)
          sources_zip=$(find "$output" -maxdepth 1 -name "*-$version-sources.zip" -print -quit)
          test -n "$chrome_zip" -a -n "$firefox_zip" -a -n "$sources_zip"
          normalize_zip() {
            source=$1
            destination=$2
            directory=$(mktemp -d)
            unzip -q "$source" -d "$directory"
            find "$directory" -exec touch -h -t 198001010000 {} +
            (cd "$directory" && find . -type f -print0 | sort -z | xargs -0 zip -X -q "$GITHUB_WORKSPACE/$destination")
            rm -rf "$directory"
          }
          normalize_zip "$chrome_zip" "release-assets/lurkloot-$version-chrome.zip"
          normalize_zip "$firefox_zip" "release-assets/lurkloot-$version-firefox.zip"
          normalize_zip "$sources_zip" "release-assets/lurkloot-$version-firefox-sources.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}-unsigned
          path: release-assets/*
          if-no-files-found: error
          retention-days: 1

  finalize:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}-unsigned
          path: release-assets
      - uses: actions/setup-node@v7
        if: inputs.sign_crx
        with:
          node-version: 24
      - name: Build signed CRX3
        if: inputs.sign_crx
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          test -n "$CRX_PRIVATE_KEY" || { echo "CRX_PRIVATE_KEY is not configured" >&2; exit 1; }
          printf '%s' "$CRX_PRIVATE_KEY" > "$RUNNER_TEMP/lurkloot.pem"
          chrome_zip=$(find release-assets -maxdepth 1 -name 'lurkloot-*-chrome.zip' -print -quit)
          test -n "$chrome_zip"
          version=${chrome_zip#release-assets/lurkloot-}
          version=${version%-chrome.zip}
          mkdir chrome-mv3
          unzip -q "$chrome_zip" -d chrome-mv3
          npx --yes crx3@2.0.0 -p "$RUNNER_TEMP/lurkloot.pem" -o "release-assets/lurkloot-$version-chrome.crx" -- chrome-mv3
          rm -f "$RUNNER_TEMP/lurkloot.pem"
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum lurkloot-* > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
      - name: Summarize extension artifacts
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          SIGN_CRX: ${{ inputs.sign_crx }}
        run: |
          printf '## Extension artifacts\n\n- Artifact: `%s`\n- Signed CRX: `%s`\n- Chrome ZIP: `%s`\n' "$ARTIFACT_NAME" "$SIGN_CRX" "$(find release-assets -maxdepth 1 -name 'lurkloot-*-chrome.zip' -printf '%f' -quit)" >> "$GITHUB_STEP_SUMMARY"
