name: Submit candidate

on:
  workflow_call:
    inputs:
      pr_number: { type: number, required: true }
      version: { type: string, required: true }
      expected_head_sha: { type: string, required: true }
      trusted_tools_ref: { type: string, required: true }

permissions:
  contents: read

jobs:
  rebuild:
    uses: ./.github/workflows/build-extension.yml
    with:
      ref: ${{ inputs.expected_head_sha }}
      artifact_name: extension-submission-verification-${{ inputs.version }}
      sign_crx: false
      trusted_tools_ref: ${{ inputs.trusted_tools_ref }}

  verify:
    needs: rebuild
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ inputs.pr_number }}
      VERSION: ${{ inputs.version }}
      EXPECTED_SHA: ${{ inputs.expected_head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_head_sha }}
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.trusted_tools_ref }}
          path: trusted-release-tools
      - run: gh release download "v$VERSION" --dir candidate
      - uses: actions/download-artifact@v8
        with:
          name: extension-submission-verification-${{ inputs.version }}
          path: fresh-build
      - name: Verify ready candidate ownership and provenance
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "${{ inputs.trusted_tools_ref }}"
          node trusted-release-tools/scripts/release/cli.mjs metadata verify candidate/candidate.json candidate
          test "$(jq -r .schemaVersion candidate/candidate.json)" = 2
          test "$(jq -r .version candidate/candidate.json)" = "$VERSION"
          test "$(jq -r .releasePr candidate/candidate.json)" = "$PR"
          test "$(jq -r .sourceSha candidate/candidate.json)" = "$EXPECTED_SHA"
          live=$(gh pr view "$PR" --json headRefOid,isDraft,state,labels)
          test "$(jq -r .headRefOid <<<"$live")" = "$EXPECTED_SHA"
          test "$(jq -r .state <<<"$live")" = OPEN
          test "$(jq -r .isDraft <<<"$live")" = false
          label=$(jq -r .releaseLabel candidate/candidate.json)
          jq -e --arg label "$label" '.labels | any(.name == $label)' <<<"$live" >/dev/null
          test "$(gh release view "v$VERSION" --json isPrerelease --jq .isPrerelease)" = true
          test "$(git ls-remote origin "refs/tags/v$VERSION" | cut -f1)" = "$EXPECTED_SHA"
          fresh=$(sha256sum "fresh-build/lurkloot-$VERSION-chrome.zip" | cut -d' ' -f1)
          test "$fresh" = "$(jq -r .chromeZipSha256 candidate/candidate.json)"

  submit:
    needs: verify
    runs-on: ubuntu-latest
    environment: cws-review
    concurrency: { group: cws-mutation, cancel-in-progress: false }
    permissions: { checks: write, contents: write, pull-requests: write }
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ inputs.pr_number }}
      VERSION: ${{ inputs.version }}
      EXPECTED_SHA: ${{ inputs.expected_head_sha }}
      CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
      CWS_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.trusted_tools_ref }}
      - run: gh release download "v$VERSION" --pattern candidate.json --dir candidate
      - name: Revalidate after cws-review approval and submit
        run: |
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "${{ inputs.trusted_tools_ref }}"
          node scripts/release/cli.mjs candidate read --file candidate/candidate.json --version "$VERSION" >/dev/null
          test "$(jq -r .schemaVersion candidate/candidate.json)" = 2
          test "$(jq -r .releasePr candidate/candidate.json)" = "$PR"
          test "$(jq -r .sourceSha candidate/candidate.json)" = "$EXPECTED_SHA"
          live=$(gh pr view "$PR" --json headRefOid,isDraft,state,labels)
          test "$(jq -r .headRefOid <<<"$live")" = "$EXPECTED_SHA"
          test "$(jq -r .state <<<"$live")" = OPEN
          test "$(jq -r .isDraft <<<"$live")" = false
          label=$(jq -r .releaseLabel candidate/candidate.json)
          jq -e --arg label "$label" '.labels | any(.name == $label)' <<<"$live" >/dev/null
          test "$(gh release view "v$VERSION" --json isPrerelease --jq .isPrerelease)" = true
          test "$(git ls-remote origin "refs/tags/v$VERSION" | cut -f1)" = "$EXPECTED_SHA"
          node scripts/cws.mjs submit-staged
          marker="<!-- lurkloot-release:$VERSION:milestone:cws-pending -->"
          bodies=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[].body')
          grep -Fq "$marker" <<<"$bodies" || gh pr comment "$PR" --body "$marker
          Candidate **v$VERSION** reached **cws-pending**. Google is reviewing the frozen candidate with deferred publishing."
