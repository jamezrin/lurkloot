name: Submit candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate semantic version
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: '[[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "version must be stable SemVer X.Y.Z" >&2; exit 1; }'

  rebuild:
    needs: validate
    uses: ./.github/workflows/build-extension.yml
    with:
      ref: v${{ inputs.version }}
      artifact_name: extension-submission-verification-${{ inputs.version }}
      sign_crx: false

  verify:
    needs: rebuild
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      pr: ${{ steps.candidate.outputs.pr }}
      checksum: ${{ steps.candidate.outputs.checksum }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          ref: main
          path: trusted-release-tools
      - name: Download frozen candidate record
        run: gh release download "v$VERSION" --dir candidate
      - uses: actions/download-artifact@v8
        with:
          name: extension-submission-verification-${{ inputs.version }}
          path: fresh-build
      - name: Verify provenance and reproducible Chrome package
        id: candidate
        run: |
          node trusted-release-tools/scripts/release/cli.mjs metadata verify candidate/candidate.json candidate
          test "$(jq -r .version candidate/candidate.json)" = "$VERSION"
          test "$(gh release view "v$VERSION" --json isPrerelease --jq .isPrerelease)" = true || { echo "v$VERSION is not an active prerelease" >&2; exit 1; }
          source_sha=$(jq -r .sourceSha candidate/candidate.json)
          test "$(git rev-parse HEAD)" = "$source_sha"
          pr=$(jq -r .releasePr candidate/candidate.json)
          test "$(gh pr view "$pr" --json state --jq .state)" = OPEN || { echo "release PR #$pr is not open" >&2; exit 1; }
          test "$(gh pr view "$pr" --json headRefOid --jq .headRefOid)" = "$source_sha"
          recorded_hash=$(jq -r .chromeZipSha256 candidate/candidate.json)
          fresh_hash=$(sha256sum "fresh-build/lurkloot-$VERSION-chrome.zip" | cut -d' ' -f1)
          test "$fresh_hash" = "$recorded_hash" || { echo "fresh chrome.zip hash $fresh_hash does not match reviewed candidate $recorded_hash" >&2; exit 1; }
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "checksum=$recorded_hash" >> "$GITHUB_OUTPUT"

  submit:
    needs: verify
    runs-on: ubuntu-latest
    environment: cws-review
    permissions:
      checks: write
      contents: write
      pull-requests: write
    concurrency:
      group: cws-mutation
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
      CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
      CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
      CWS_VERSION: ${{ inputs.version }}
      VERIFIED_SHA: ${{ needs.verify.outputs.sha }}
      VERIFIED_PR: ${{ needs.verify.outputs.pr }}
      VERIFIED_CHECKSUM: ${{ needs.verify.outputs.checksum }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Download frozen candidate metadata
        run: gh release download "v$VERSION" --pattern candidate.json --dir candidate
      - name: Recheck frozen candidate after acquiring CWS lock
        run: |
          node scripts/release/cli.mjs candidate read --file candidate/candidate.json --version "$VERSION" >/dev/null
          test "$(jq -r .sourceSha candidate/candidate.json)" = "$VERIFIED_SHA"
          test "$(jq -r .releasePr candidate/candidate.json)" = "$VERIFIED_PR"
          test "$(jq -r .chromeZipSha256 candidate/candidate.json)" = "$VERIFIED_CHECKSUM"
          test "$(gh pr view "$VERIFIED_PR" --json headRefOid --jq .headRefOid)" = "$VERIFIED_SHA"
          test "$(gh pr view "$VERIFIED_PR" --json state --jq .state)" = OPEN
          test "$(gh release view "v$VERSION" --json isPrerelease --jq .isPrerelease)" = true
          test "$(git ls-remote origin "refs/tags/v$VERSION" | cut -f1)" = "$VERIFIED_SHA"
      - id: cws
        name: Submit with deferred publishing
        run: node scripts/cws.mjs submit-staged
      - id: release-ready
        name: Render pending release gate
        env:
          ACTION: ${{ steps.cws.outputs.action }}
        run: node scripts/release/cli.mjs submit-check --action "$ACTION" --version "$VERSION"
      - name: Mark PR ready and notify releaser
        env:
          PR: ${{ needs.verify.outputs.pr }}
          SHA: ${{ needs.verify.outputs.sha }}
          ACTION: ${{ steps.cws.outputs.action }}
          CHECK_STATUS: ${{ steps.release-ready.outputs.status }}
          CHECK_TITLE: ${{ steps.release-ready.outputs.title }}
          CHECK_SUMMARY: ${{ steps.release-ready.outputs.summary }}
        run: |
          gh pr ready "$PR" || true
          action="$ACTION"
          initiator=$(jq -r .initiator candidate/candidate.json)
          if [[ "$action" == already-staged ]]; then
            state=STAGED
            gh release edit "v$VERSION" --prerelease --latest=false --notes "Frozen candidate from $SHA for release PR #$PR. Chrome Web Store version $VERSION is STAGED and ready for final approval."
          else
            state=PENDING_REVIEW
            gh release edit "v$VERSION" --prerelease --latest=false --notes "Frozen candidate from $SHA for release PR #$PR. Chrome Web Store version $VERSION is PENDING_REVIEW with staged publishing. Candidate assets and tag are immutable until cancellation or stable promotion."
            marker="<!-- lurkloot-release:$VERSION:cws:PENDING_REVIEW -->"
            if ! gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[].body' | grep -Fq "$marker"; then
              gh pr comment "$PR" --body "$marker
            @$initiator, **v$VERSION** was submitted to CWS with deferred publishing and is pending review."
            fi
          fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" -f name=cws-release-ready -f head_sha="$SHA" -f status="$CHECK_STATUS" -f output[title]="$CHECK_TITLE" -f output[summary]="$CHECK_SUMMARY"
          printf '## Candidate v%s submitted\n\n- PR: #%s\n- Source: `%s`\n- State: `%s`\n' "$VERSION" "$PR" "$SHA" "$state" >> "$GITHUB_STEP_SUMMARY"
