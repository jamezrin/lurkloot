name: Submit candidate

on:
  workflow_call:
    inputs:
      pr_number: { type: number, required: true }
      version: { type: string, required: true }
      expected_head_sha: { type: string, required: true }
      trusted_tools_ref: { type: string, required: true }

permissions:
  contents: read

jobs:
  resolve-tools:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    outputs:
      trusted_tools_ref: ${{ steps.main.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.trusted_tools_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUSTED_TOOLS_REF: ${{ inputs.trusted_tools_ref }}
        run: node scripts/release/cli.mjs trusted-tools --expected "$TRUSTED_TOOLS_REF"

  rebuild:
    needs: resolve-tools
    uses: ./.github/workflows/build-extension.yml
    with:
      ref: ${{ inputs.expected_head_sha }}
      version: ${{ inputs.version }}
      artifact_name: extension-submission-verification-${{ inputs.version }}
      sign_crx: false
      trusted_tools_ref: ${{ needs.resolve-tools.outputs.trusted_tools_ref }}

  verify:
    needs: [resolve-tools, rebuild]
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read }
    steps:
      # Only trusted tooling is checked out; the candidate itself arrives as frozen release assets.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.trusted_tools_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: extension-submission-verification-${{ inputs.version }}
          path: fresh-build
      - name: Verify ready candidate ownership and seal pre-approval evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pr_number }}
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_head_sha }}
          TRUSTED_TOOLS_REF: ${{ inputs.trusted_tools_ref }}
        run: >-
          node scripts/release/cli.mjs submission verify
          --pr "$PR" --version "$VERSION" --expected-sha "$EXPECTED_SHA" --trusted-tools "$TRUSTED_TOOLS_REF"
          --candidate-dir candidate --fresh-zip "fresh-build/lurkloot-$VERSION-chrome.zip"
          --evidence-dir verification
      - uses: actions/upload-artifact@v7
        with:
          name: extension-submission-evidence-${{ inputs.version }}
          path: verification
          if-no-files-found: error
          retention-days: 1

  submit:
    needs: verify
    runs-on: ubuntu-latest
    environment: cws-review
    concurrency: { group: cws-mutation, cancel-in-progress: false }
    permissions: { checks: write, contents: write, pull-requests: write }
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ inputs.pr_number }}
      VERSION: ${{ inputs.version }}
      EXPECTED_SHA: ${{ inputs.expected_head_sha }}
      TRUSTED_TOOLS_REF: ${{ inputs.trusted_tools_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.trusted_tools_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: extension-submission-evidence-${{ inputs.version }}
          path: verification
      - name: Download frozen release assets again
        run: node scripts/release/cli.mjs release download --tag "v$VERSION" --dir candidate
      - id: mutation
        name: Revalidate after cws-review approval and submit
        continue-on-error: true
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: >-
          node scripts/release/cli.mjs submission submit
          --pr "$PR" --version "$VERSION" --expected-sha "$EXPECTED_SHA" --trusted-tools "$TRUSTED_TOOLS_REF"
          --candidate-dir candidate --evidence verification/evidence.json
      - if: always() && steps.mutation.outcome != 'success'
        name: Publish actionable submission failure
        run: >-
          node scripts/release/cli.mjs submission blocked
          --pr "$PR" --version "$VERSION" --expected-sha "$EXPECTED_SHA"
