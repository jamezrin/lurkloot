name: Cancel candidate

on:
  workflow_call:
    inputs:
      pr_number: { type: number, required: true }
      candidate_version: { type: string, required: true }
      expected_candidate_sha: { type: string, required: true }
      expected_live_head_sha: { type: string, required: true }
      desired_release_labels: { type: string, required: true }
      expected_pr_state: { type: string, required: true }
      disposition: { type: string, required: true }
    outputs:
      cancelled:
        value: ${{ jobs.cancel.outputs.cancelled }}
      safe_to_replace:
        value: ${{ jobs.cancel.outputs.safe_to_replace }}
      reason:
        value: ${{ jobs.cancel.outputs.reason }}

permissions:
  contents: read

jobs:
  resolve-tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      main_sha: ${{ steps.main.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/cli.mjs resolve-ref --ref main

  cancel:
    needs: resolve-tools
    runs-on: ubuntu-latest
    environment: cws-review
    concurrency:
      group: cws-mutation
      cancel-in-progress: false
    permissions:
      checks: write
      contents: write
      packages: write
      pull-requests: write
    outputs:
      cancelled: ${{ steps.finalize.outputs.cancelled }}
      safe_to_replace: ${{ steps.finalize.outputs.safe_to_replace }}
      reason: ${{ steps.finalize.outputs.reason }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ inputs.pr_number }}
      VERSION: ${{ inputs.candidate_version }}
      EXPECTED_SHA: ${{ inputs.expected_candidate_sha }}
      EXPECTED_LIVE_HEAD_SHA: ${{ inputs.expected_live_head_sha }}
      EXPECTED_DESIRED_LABELS: ${{ inputs.desired_release_labels }}
      EXPECTED_PR_STATE: ${{ inputs.expected_pr_state }}
      DISPOSITION: ${{ inputs.disposition }}
      TRUSTED_TOOLS_REF: ${{ needs.resolve-tools.outputs.main_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-tools.outputs.main_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: operation
        name: Cancel and confirm the exact candidate
        continue-on-error: true
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: >-
          node scripts/release/cli.mjs cancel run
          --pr "$PR" --version "$VERSION" --expected-sha "$EXPECTED_SHA"
          --expected-live-head-sha "$EXPECTED_LIVE_HEAD_SHA" --desired-labels "$EXPECTED_DESIRED_LABELS"
          --expected-pr-state "$EXPECTED_PR_STATE" --disposition "$DISPOSITION"
          --trusted-tools "$TRUSTED_TOOLS_REF" --candidate-dir candidate
      - id: finalize
        if: always()
        name: Publish cancellation result and recovery guidance
        env:
          SUCCEEDED: ${{ steps.operation.outcome == 'success' }}
        run: >-
          node scripts/release/cli.mjs cancel finalize
          --pr "$PR" --version "$VERSION" --expected-sha "$EXPECTED_SHA"
          --succeeded "$SUCCEEDED"
