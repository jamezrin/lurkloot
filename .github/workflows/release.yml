name: Publish declared release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_stable_rebuild:
        description: Allow explicitly approved replacement of an existing stable release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Publication mutates shared tags, releases, store state, and Docker aliases,
  # so every invocation must serialize regardless of its triggering ref.
  group: declared-release
  cancel-in-progress: true

jobs:
  declaration:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      docker_tags: ${{ steps.release.outputs.docker_tags }}
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - id: release
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          channel=$(node -p "require('./package.json').release.channel")
          case "$channel" in
            prerelease) prerelease=true ;;
            stable) prerelease=false ;;
            *) echo "Unsupported release channel: $channel" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          {
            echo 'docker_tags<<EOF'
            echo "$version"
            echo "sha-${GITHUB_SHA::12}"
            if [[ "$prerelease" == true ]]; then
              echo main
            else
              echo "${version%.*}"
              echo "${version%%.*}"
              echo latest
            fi
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Protect stable releases from mutation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          OVERRIDE: ${{ inputs.allow_stable_rebuild || false }}
        run: |
          existing=$(gh release view "v$VERSION" --json isPrerelease --jq .isPrerelease 2>/dev/null || true)
          if [[ "$existing" == false && "$OVERRIDE" != true ]]; then
            echo "v$VERSION is already stable. Declare the next pre-release, or manually dispatch with the protected stable-releases environment approval and override." >&2
            exit 1
          fi
          if [[ "$PRERELEASE" == true && "$existing" == false ]]; then
            echo "A stable v$VERSION cannot be changed back to a pre-release." >&2
            exit 1
          fi

  approval:
    needs: declaration
    runs-on: ubuntu-latest
    environment: ${{ (needs.declaration.outputs.prerelease == 'false' || inputs.allow_stable_rebuild) && 'stable-releases' || 'prereleases' }}
    steps:
      - run: echo "Release environment approved"

  verify:
    needs: [declaration, approval]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  extension:
    needs: [declaration, verify]
    uses: ./.github/workflows/build-extension.yml
    with:
      sign_crx: true
    secrets:
      CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}

  docker:
    needs: [declaration, verify]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-docker.yml
    with:
      push: true

  chrome-web-store:
    needs: [declaration, extension, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: extension-release-assets
          path: release-assets
      - name: Validate staged candidate provenance
        if: needs.declaration.outputs.prerelease == 'false'
        env:
          VERSION: ${{ needs.declaration.outputs.version }}
        run: |
          candidate="refs/tags/cws-v$VERSION-candidate"
          git fetch origin "+$candidate:$candidate"
          candidate_commit=$(git rev-parse "$candidate^{commit}")
          candidate_checksum=$(git for-each-ref --format='%(contents)' "$candidate" | sed -n 's/^chrome_zip_sha256=//p')
          test -n "$candidate_checksum" || {
            echo "CWS candidate tag does not contain a Chrome ZIP checksum" >&2
            exit 1
          }
          echo "Validated CWS candidate $candidate_commit with Chrome ZIP SHA-256 $candidate_checksum"
          git merge-base --is-ancestor "$candidate_commit" "$GITHUB_SHA" || {
            echo "CWS candidate $candidate_commit is not an ancestor of $GITHUB_SHA" >&2
            exit 1
          }
          git diff --quiet "$candidate_commit" "$GITHUB_SHA" -- \
            pnpm-lock.yaml pnpm-workspace.yaml tsconfig.base.json \
            packages/extension packages/core packages/shared packages/locales packages/popup-ui || {
            echo "Extension build inputs changed after the CWS candidate was uploaded; upload and review a new candidate." >&2
            exit 1
          }
          diff -u \
            <(git show "$candidate_commit:package.json" | jq -S 'del(.release.channel)') \
            <(jq -S 'del(.release.channel)' package.json) || {
            echo "Root package build inputs other than release.channel changed after the CWS candidate was uploaded." >&2
            exit 1
          }
      - id: prerelease
        name: Upload mutable pre-release draft
        if: needs.declaration.outputs.prerelease == 'true'
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_VERSION: ${{ needs.declaration.outputs.version }}
          CWS_PACKAGE_PATH: release-assets/lurkloot-${{ needs.declaration.outputs.version }}-chrome.zip
        run: node scripts/cws.mjs upload-prerelease
      - name: Record uploaded candidate commit
        if: steps.prerelease.outputs.candidate == 'true'
        env:
          VERSION: ${{ needs.declaration.outputs.version }}
        run: |
          tag="cws-v$VERSION-candidate"
          checksum=$(sha256sum "release-assets/lurkloot-$VERSION-chrome.zip" | awk '{print $1}')
          git \
            -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag --force --annotate "$tag" "$GITHUB_SHA" --message "chrome_zip_sha256=$checksum"
          git push --force origin "refs/tags/$tag"
      - id: stable
        name: Publish approved staged revision
        if: needs.declaration.outputs.prerelease == 'false'
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_VERSION: ${{ needs.declaration.outputs.version }}
        run: node scripts/cws.mjs publish-stable
      - name: Summarize Chrome Web Store state
        env:
          PRERELEASE_ACTION: ${{ steps.prerelease.outputs.action }}
          STABLE_ACTION: ${{ steps.stable.outputs.action }}
        run: |
          action=${PRERELEASE_ACTION:-$STABLE_ACTION}
          echo "### Chrome Web Store" >> "$GITHUB_STEP_SUMMARY"
          echo "Action: **$action**" >> "$GITHUB_STEP_SUMMARY"

  docker-publish:
    needs: [declaration, docker, chrome-web-store]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/lurkloot-cli
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: docker-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifest
        working-directory: /tmp/digests
        env:
          TAGS: ${{ needs.declaration.outputs.docker_tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            test -z "$tag" || tag_args+=(--tag "${IMAGE_NAME}:${tag}")
          done <<< "$TAGS"
          digest_args=()
          for digest in *; do digest_args+=("${IMAGE_NAME}@sha256:${digest}"); done
          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"
          first_tag=${TAGS%%$'\n'*}
          docker buildx imagetools inspect "${IMAGE_NAME}:${first_tag}" | tee /tmp/manifest.txt
          grep -q 'linux/amd64' /tmp/manifest.txt
          grep -q 'linux/arm64' /tmp/manifest.txt

  publish:
    needs: [declaration, verify, extension, docker-publish, chrome-web-store]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: extension-release-assets
          path: release-assets
      - name: Move version tag
        env:
          VERSION: ${{ needs.declaration.outputs.version }}
        run: |
          git tag --force "v$VERSION" "$GITHUB_SHA"
          git push --force origin "v$VERSION"
      - name: Replace release and assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.declaration.outputs.version }}
          PRERELEASE: ${{ needs.declaration.outputs.prerelease }}
        run: |
          tag="v$VERSION"
          built_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          notes=$(printf 'Automated build of `%s` from commit `%s`, built at `%s`.' "$tag" "$GITHUB_SHA" "$built_at")
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done
            args=(--title "$tag" --notes "$notes")
            [[ "$PRERELEASE" == true ]] && args+=(--prerelease --latest=false) || args+=(--latest)
            gh release edit "$tag" "${args[@]}"
          else
            args=(--title "$tag" --notes "$notes" --verify-tag)
            [[ "$PRERELEASE" == true ]] && args+=(--prerelease --latest=false) || args+=(--latest)
            gh release create "$tag" "${args[@]}"
          fi
          gh release upload "$tag" release-assets/*
      - name: Verify downloadable assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.declaration.outputs.version }}
        run: |
          mkdir downloaded
          gh release download "v$VERSION" --dir downloaded
          cd downloaded
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 5

  site:
    needs: [declaration, publish]
    uses: ./.github/workflows/site-deploy.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
