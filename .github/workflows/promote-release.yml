name: Promote reviewed release

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged release PR to recover
        type: number
        required: true

permissions:
  contents: read

concurrency:
  group: stable-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.resolve.outputs.pr }}
      trusted_tools_ref: ${{ steps.resolve.outputs.trusted_tools_ref }}
    permissions:
      contents: read
      pull-requests: read
    env:
      EVENT_PR: ${{ github.event.pull_request.number }}
      INPUT_PR: ${{ inputs.pr_number }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: resolve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/cli.mjs promote begin --pr "${EVENT_PR:-$INPUT_PR}"

  candidate:
    needs: resolve
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.release.outputs.active }}
      version: ${{ steps.release.outputs.version }}
      kind: ${{ steps.release.outputs.kind }}
      initiator: ${{ steps.release.outputs.initiator }}
      head_sha: ${{ steps.release.outputs.head_sha }}
      merge_sha: ${{ steps.release.outputs.merge_sha }}
      label: ${{ steps.release.outputs.label }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.trusted_tools_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ needs.resolve.outputs.pr }}
          TRUSTED_TOOLS_REF: ${{ needs.resolve.outputs.trusted_tools_ref }}
        run: >-
          node scripts/release/cli.mjs promote resolve
          --pr "$PR" --trusted-tools "$TRUSTED_TOOLS_REF" --asset-dir release-assets
      - uses: actions/upload-artifact@v7
        if: steps.release.outputs.active == 'true'
        with:
          name: stable-release-assets-${{ steps.release.outputs.version }}
          path: release-assets

  publish:
    if: needs.candidate.outputs.active == 'true'
    needs: [resolve, candidate]
    runs-on: ubuntu-latest
    environment: stable-releases
    permissions:
      contents: write
      packages: write
      pull-requests: read
    concurrency:
      group: cws-mutation
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ needs.resolve.outputs.pr }}
      VERSION: ${{ needs.candidate.outputs.version }}
      EXPECTED_HEAD_SHA: ${{ needs.candidate.outputs.head_sha }}
      EXPECTED_MERGE_SHA: ${{ needs.candidate.outputs.merge_sha }}
      RELEASE_LABEL: ${{ needs.candidate.outputs.label }}
      TRUSTED_TOOLS_REF: ${{ needs.resolve.outputs.trusted_tools_ref }}
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/lurkloot-cli
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.trusted_tools_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: stable-release-assets-${{ needs.candidate.outputs.version }}
          path: release-assets
      - name: Revalidate and publish approved staged revision
        env:
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
        run: >-
          node scripts/release/cli.mjs promote publish
          --pr "$PR" --version "$VERSION" --expected-head-sha "$EXPECTED_HEAD_SHA"
          --expected-merge-sha "$EXPECTED_MERGE_SHA" --label "$RELEASE_LABEL"
          --trusted-tools "$TRUSTED_TOOLS_REF" --asset-dir release-assets
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        name: Revalidate and resolve stored Docker digests
        run: >-
          node scripts/release/cli.mjs promote docker-tags
          --pr "$PR" --version "$VERSION" --expected-head-sha "$EXPECTED_HEAD_SHA"
          --expected-merge-sha "$EXPECTED_MERGE_SHA" --label "$RELEASE_LABEL"
          --asset-dir release-assets --image "$IMAGE_NAME"
      # docker buildx has no API equivalent; the tag and digest arguments are resolved and
      # revalidated above so this step only carries out the manifest write.
      - name: Promote stored Docker digests
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          SOURCES: ${{ steps.tags.outputs.sources }}
        run: docker buildx imagetools create $TAGS $SOURCES
      - name: Promote immutable GitHub release
        run: >-
          node scripts/release/cli.mjs promote release
          --pr "$PR" --version "$VERSION" --expected-head-sha "$EXPECTED_HEAD_SHA"
          --expected-merge-sha "$EXPECTED_MERGE_SHA" --label "$RELEASE_LABEL"
          --asset-dir release-assets

  site:
    if: needs.candidate.outputs.active == 'true'
    needs: [candidate, publish]
    uses: ./.github/workflows/site-deploy.yml
    with:
      channel: production
      ref: ${{ needs.candidate.outputs.merge_sha }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  forward-release:
    if: needs.candidate.outputs.active == 'true'
    needs: [candidate, site]
    uses: ./.github/workflows/forward-hotfix.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    with:
      version: ${{ needs.candidate.outputs.version }}
      kind: ${{ needs.candidate.outputs.kind }}
      expected_main_sha: ${{ needs.candidate.outputs.merge_sha }}

  notify:
    if: needs.candidate.outputs.active == 'true'
    needs: [resolve, candidate, site, forward-release]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.candidate.outputs.version }}
      INITIATOR: ${{ needs.candidate.outputs.initiator }}
      PR: ${{ needs.resolve.outputs.pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.trusted_tools_ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Announce stable publication once
        run: >-
          node scripts/release/cli.mjs promote notify
          --pr "$PR" --version "$VERSION" --initiator "$INITIATOR"
