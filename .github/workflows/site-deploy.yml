name: Deploy site

on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [prerelease, production]
        required: true
      ref:
        type: string
        default: main
        required: true
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      ref:
        type: string
        required: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
      WORKERS_AI_API_TOKEN:
        required: true

permissions:
  contents: read

concurrency:
  group: site-deploy-${{ inputs.channel }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # workflow_call cannot constrain inputs to the dispatch choice list, so an unknown channel
      # would otherwise fall through the deploy ternaries and silently ship to prerelease.
      - name: Validate deployment channel
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          case "$CHANNEL" in
            prerelease|production) ;;
            *) echo "Unsupported release channel: $CHANNEL" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: ./.github/actions/build-site
        with:
          channel: ${{ inputs.channel }}
          workers_ai_token: ${{ secrets.WORKERS_AI_API_TOKEN }}
          account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v7
        with:
          name: site-${{ inputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/site/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The `prerelease` channel deploys to the environment named `preview`: the channel name is
    # constrained by the site build (astro.config.mjs validates SITE_DEPLOYMENT_CHANNEL against
    # {prerelease, production}), while the environment name comes from the two-environment model.
    environment:
      name: ${{ inputs.channel == 'production' && 'production' || 'preview' }}
      url: ${{ inputs.channel == 'production' && 'https://lurkloot.jamezrin.com' || 'https://next.lurkloot.pages.dev' }}
    steps:
      # The local deployment action comes from the trusted caller commit. Candidate source remains
      # confined to the credential-free build job and crosses this boundary only as checksummed data.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: site-${{ inputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: site-artifact
      - uses: ./.github/actions/deploy-site
        with:
          channel: ${{ inputs.channel }}
          directory: site-artifact
          api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Summarize deployment
        env:
          DEPLOY_CHANNEL: ${{ inputs.channel }}
          SOURCE_REF: ${{ inputs.ref }}
          DEPLOY_URL: ${{ inputs.channel == 'production' && 'https://lurkloot.jamezrin.com' || 'https://next.lurkloot.pages.dev' }}
        run: |
          printf '## Site deployed\n\n- Channel: `%s`\n- Source ref: `%s`\n- URL: %s\n' "$DEPLOY_CHANNEL" "$SOURCE_REF" "$DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
