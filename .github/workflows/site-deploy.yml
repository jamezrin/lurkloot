name: Deploy site

# Build the Astro landing site and deploy it to the production Cloudflare Pages
# project (lurkloot) on push to main. Path-filtered so unrelated changes don't
# redeploy; workflow_dispatch allows manual redeploys.

on:
  push:
    branches: [main]
    paths:
      - 'packages/site/**'
      - 'packages/shared/**'
      - 'packages/popup-ui/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/site-deploy.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      after_release:
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: site-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.decision.outputs.deploy }}
    steps:
      - name: Require the main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v7
      - id: decision
        env:
          AFTER_RELEASE: ${{ inputs.after_release || false }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          channel=$(node -p "require('./package.json').release.channel")
          if [[ "$EVENT_NAME" == push && "$channel" == stable && "$AFTER_RELEASE" != true ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Stable site deployment is deferred until release publication succeeds."
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    name: Build & deploy
    runs-on: ubuntu-latest
    environment:
      name: production-site
      url: https://lurkloot.jamezrin.com
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build:site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/site
          command: pages deploy dist --project-name=lurkloot --branch=main
