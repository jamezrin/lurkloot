name: Deploy site

on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [prerelease, production]
        required: true
      ref:
        type: string
        default: main
        required: true
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      ref:
        type: string
        required: true
      pr_number:
        type: string
        default: ""
      expected_head_sha:
        type: string
        default: ""
      release_label:
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: site-deploy-${{ inputs.channel }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # workflow_call cannot constrain inputs to the dispatch choice list, so an unknown channel
      # would otherwise fall through the deploy ternaries and silently ship to prerelease.
      - name: Validate deployment channel
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          case "$CHANNEL" in
            prerelease|production) ;;
            *) echo "Unsupported release channel: $CHANNEL" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:site
        env:
          SITE_DEPLOYMENT_CHANNEL: ${{ inputs.channel }}
      - name: Checksum static site artifact
        run: |
          cd packages/site/dist
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SITE_SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: site-${{ inputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: packages/site/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    environment:
      name: ${{ inputs.channel == 'production' && 'production-site' || 'prerelease-site' }}
      url: ${{ inputs.channel == 'production' && 'https://lurkloot.jamezrin.com' || 'https://next.lurkloot.pages.dev' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site-${{ inputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: site-artifact
      - name: Verify static site artifact
        working-directory: site-artifact
        run: sha256sum -c SITE_SHA256SUMS
      - name: Revalidate candidate immediately before prerelease deployment
        if: inputs.channel == 'prerelease'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          RELEASE_LABEL: ${{ inputs.release_label }}
        run: |
          live=$(gh pr view "$PR" --json headRefOid,labels)
          test "$(jq -r .headRefOid <<<"$live")" = "$EXPECTED_HEAD_SHA"
          test "$(jq --arg label "$RELEASE_LABEL" '[.labels[].name == $label] | any' <<<"$live")" = true
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site-artifact
          command: pages deploy . --project-name=lurkloot --branch=${{ inputs.channel == 'production' && 'main' || 'next' }}
      - name: Summarize deployment
        env:
          DEPLOY_CHANNEL: ${{ inputs.channel }}
          SOURCE_REF: ${{ inputs.ref }}
          DEPLOY_URL: ${{ inputs.channel == 'production' && 'https://lurkloot.jamezrin.com' || 'https://next.lurkloot.pages.dev' }}
        run: |
          printf '## Site deployed\n\n- Channel: `%s`\n- Source ref: `%s`\n- URL: %s\n' "$DEPLOY_CHANNEL" "$SOURCE_REF" "$DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
