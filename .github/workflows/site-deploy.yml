name: Deploy site

on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [prerelease, production]
        required: true
      ref:
        type: string
        default: main
        required: true
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      ref:
        type: string
        required: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: site-deploy-${{ inputs.channel }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.channel == 'production' && 'production-site' || 'prerelease-site' }}
      url: ${{ inputs.channel == 'production' && 'https://lurkloot.jamezrin.com' || 'https://next.lurkloot.pages.dev' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:site
        env:
          SITE_DEPLOYMENT_CHANNEL: ${{ inputs.channel }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: packages/site
          command: pages deploy dist --project-name=lurkloot --branch=${{ inputs.channel == 'production' && 'main' || 'next' }}
