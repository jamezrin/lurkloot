name: Forward stable release to develop

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      kind:
        type: string
        required: true
      expected_main_sha:
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  forward:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
      KIND: ${{ inputs.kind }}
      EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
    steps:
      # Only release tooling is checked out; the merge itself runs server-side through the API,
      # so no working tree, credentials, or push are needed.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Open synchronization PR
        run: >-
          node scripts/release/cli.mjs forward run
          --version "$VERSION" --kind "$KIND" --expected-main-sha "$EXPECTED_MAIN_SHA"
