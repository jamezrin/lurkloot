name: Forward stable release to develop

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      kind:
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  forward:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ inputs.version }}
      KIND: ${{ inputs.kind }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - name: Open synchronization PR
        run: |
          [[ "$KIND" == normal || "$KIND" == hotfix ]] || { echo "kind must be normal or hotfix" >&2; exit 1; }
          branch="chore/forward-release-$VERSION"
          git fetch origin -- main develop
          existing_pr=$(gh pr list --state open --head "$branch" --base develop --json number --jq '.[0].number // empty')
          if [[ -n "$existing_pr" ]] || git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            printf '## Release v%s forward merge\n\nSynchronization branch already exists%s; leaving it unchanged.\n' "$VERSION" "${existing_pr:+ as PR #$existing_pr}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git switch -C "$branch" origin/develop
          if ! git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com merge --no-ff origin/main -m "chore: forward $KIND release $VERSION"; then
            git merge --abort
            issue=$(gh issue create --label release-forward-merge --title "chore: forward release $VERSION to develop" --body "Automatic main → develop synchronization conflicted after $KIND release v$VERSION. Create a branch from develop, merge main into it, resolve the conflicts without changing main, and open a PR back to develop before the next normal release.")
            printf '## Release v%s needs manual forward merge\n\nAutomatic merge conflicted. Follow %s before the next normal release.\n' "$VERSION" "$issue" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push origin "$branch"
          pr=$(gh pr list --state open --head "$branch" --base develop --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            pr=$(gh pr create --base develop --head "$branch" --label release-forward-merge --title "chore: forward release $VERSION" --body "Carries stable $KIND release v$VERSION metadata and any production-only fixes from main into develop." | sed 's#.*/##')
          fi
          printf '## Release v%s forward merge\n\nOpened or refreshed PR #%s from main into develop.\n' "$VERSION" "$pr" >> "$GITHUB_STEP_SUMMARY"
