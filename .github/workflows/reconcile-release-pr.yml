name: Reconcile release PR

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled, converted_to_draft, ready_for_review, closed]

permissions:
  contents: read

concurrency:
  group: release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
    outputs:
      action: ${{ steps.inspect.outputs.action }}
      convert_to_draft: ${{ steps.inspect.outputs.convert_to_draft }}
      state: ${{ steps.inspect.outputs.state }}
      reason: ${{ steps.inspect.outputs.reason }}
      pr_number: ${{ steps.inspect.outputs.pr_number }}
      head_sha: ${{ steps.inspect.outputs.head_sha }}
      version: ${{ steps.inspect.outputs.version }}
      kind: ${{ steps.inspect.outputs.kind }}
      release_label: ${{ steps.inspect.outputs.release_label }}
      authorized_by: ${{ steps.inspect.outputs.authorized_by }}
      stable_sha: ${{ steps.inspect.outputs.stable_sha }}
      stable_version: ${{ steps.inspect.outputs.stable_version }}
      develop_sha: ${{ steps.inspect.outputs.develop_sha }}
      trusted_tools_ref: ${{ steps.inspect.outputs.trusted_tools_ref }}
      candidate_version: ${{ steps.inspect.outputs.candidate_version }}
      candidate_sha: ${{ steps.inspect.outputs.candidate_sha }}
      candidate_label: ${{ steps.inspect.outputs.candidate_label }}
      desired_release_labels: ${{ steps.inspect.outputs.desired_release_labels }}
      closed: ${{ steps.inspect.outputs.closed }}
      milestone: ${{ steps.inspect.outputs.milestone }}
    steps:
      # Only release tooling from the PR base is checked out. Candidate history never lands on this
      # privileged runner; ancestry now resolves through the compare API instead of git plumbing.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: inspect
        name: Inspect live policy and candidate ownership
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_LABEL: ${{ github.event.label.name }}
        run: |
          node scripts/release/cli.mjs inspect --pr "$PR" --event "$EVENT_ACTION" --actor "$EVENT_ACTOR" --label "$EVENT_LABEL"

  prepare:
    needs: inspect
    if: needs.inspect.outputs.action == 'prepare'
    permissions:
      actions: read
      checks: write
      contents: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/prepare-prerelease.yml
    with:
      pr_number: ${{ needs.inspect.outputs.pr_number }}
      expected_head_sha: ${{ needs.inspect.outputs.head_sha }}
      version: ${{ needs.inspect.outputs.version }}
      kind: ${{ needs.inspect.outputs.kind }}
      release_label: ${{ needs.inspect.outputs.release_label }}
      authorized_by: ${{ needs.inspect.outputs.authorized_by }}
      stable_sha: ${{ needs.inspect.outputs.stable_sha }}
      stable_version: ${{ needs.inspect.outputs.stable_version }}
      develop_sha: ${{ needs.inspect.outputs.develop_sha }}
      trusted_tools_ref: ${{ needs.inspect.outputs.trusted_tools_ref }}
    secrets: inherit

  cancel:
    needs: inspect
    if: needs.inspect.outputs.action == 'cancel' || needs.inspect.outputs.action == 'retire' || needs.inspect.outputs.action == 'cancel-and-prepare'
    permissions:
      checks: write
      contents: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/cancel-candidate.yml
    with:
      pr_number: ${{ fromJSON(needs.inspect.outputs.pr_number) }}
      candidate_version: ${{ needs.inspect.outputs.candidate_version }}
      expected_candidate_sha: ${{ needs.inspect.outputs.candidate_sha }}
      expected_live_head_sha: ${{ needs.inspect.outputs.head_sha }}
      desired_release_labels: ${{ needs.inspect.outputs.desired_release_labels }}
      expected_pr_state: ${{ needs.inspect.outputs.closed == 'true' && 'closed-unmerged' || 'open' }}
      disposition: ${{ needs.inspect.outputs.action == 'cancel-and-prepare' && 'replace' || 'retire' }}
    secrets: inherit

  cancel-and-prepare:
    needs: [inspect, cancel]
    if: needs.inspect.outputs.action == 'cancel-and-prepare' && needs.cancel.result == 'success' && needs.cancel.outputs.safe_to_replace == 'true'
    permissions:
      actions: read
      checks: write
      contents: write
      packages: write
      pull-requests: write
    uses: ./.github/workflows/prepare-prerelease.yml
    with:
      pr_number: ${{ needs.inspect.outputs.pr_number }}
      expected_head_sha: ${{ needs.inspect.outputs.head_sha }}
      version: ${{ needs.inspect.outputs.version }}
      kind: ${{ needs.inspect.outputs.kind }}
      release_label: ${{ needs.inspect.outputs.release_label }}
      authorized_by: ${{ needs.inspect.outputs.authorized_by }}
      stable_sha: ${{ needs.inspect.outputs.stable_sha }}
      stable_version: ${{ needs.inspect.outputs.stable_version }}
      develop_sha: ${{ needs.inspect.outputs.develop_sha }}
      trusted_tools_ref: ${{ needs.inspect.outputs.trusted_tools_ref }}
    secrets: inherit

  submit:
    needs: inspect
    if: needs.inspect.outputs.action == 'submit'
    permissions:
      actions: read
      checks: write
      contents: write
      pull-requests: write
    uses: ./.github/workflows/submit-candidate.yml
    with:
      pr_number: ${{ fromJSON(needs.inspect.outputs.pr_number) }}
      version: ${{ needs.inspect.outputs.version }}
      expected_head_sha: ${{ needs.inspect.outputs.head_sha }}
      trusted_tools_ref: ${{ needs.inspect.outputs.trusted_tools_ref }}
    secrets: inherit

  notify:
    needs: [inspect, prepare, cancel, cancel-and-prepare, submit]
    if: always() && needs.inspect.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PR: ${{ needs.inspect.outputs.pr_number }}
      VERSION: ${{ needs.inspect.outputs.version }}
      SOURCE_SHA: ${{ needs.inspect.outputs.head_sha }}
      STATE: ${{ needs.inspect.outputs.state }}
      ACTION: ${{ needs.inspect.outputs.action }}
      REASON: ${{ needs.inspect.outputs.reason }}
      MILESTONE: ${{ needs.inspect.outputs.milestone }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Upsert sticky status and one-time blocker milestone
        run: >-
          node scripts/release/cli.mjs notify
          --pr "$PR" --state "$STATE" --version "$VERSION" --source-sha "$SOURCE_SHA"
          --activity "$ACTION" --blocker "$REASON" --milestone "$MILESTONE"
